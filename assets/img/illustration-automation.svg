<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="illo-automation-title">
  <title id="illo-automation-title">Workflow steps connected by a line, with one step automatically flowing into the next</title>
  <rect width="400" height="300" fill="none"/>
  <!-- flow line -->
  <path d="M60 220 C 120 220, 120 140, 180 140 C 240 140, 240 80, 300 80" fill="none" stroke="#2A2A2D" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- step nodes -->
  <g>
    <rect x="30" y="195" width="60" height="50" rx="8" fill="#F6F4F1" stroke="#2A2A2D" stroke-width="2"/>
    <rect x="42" y="210" width="36" height="6" rx="3" fill="#2A2A2D"/>
    <rect x="42" y="222" width="24" height="6" rx="3" fill="#2A2A2D"/>
  </g>
  <g>
    <rect x="150" y="115" width="60" height="50" rx="8" fill="#F6F4F1" stroke="#2A2A2D" stroke-width="2"/>
    <circle cx="180" cy="140" r="14" fill="none" stroke="#E8590C" stroke-width="3"/>
    <path d="M180 132 v8 l6 4" fill="none" stroke="#E8590C" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="270" y="55" width="70" height="50" rx="8" fill="#E8590C"/>
    <path d="M288 80 l8 8 16 -20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- small automation gear accent -->
  <g transform="translate(330,220)">
    <circle r="22" fill="none" stroke="#2A2A2D" stroke-width="3"/>
    <circle r="7" fill="#2A2A2D"/>
    <g stroke="#2A2A2D" stroke-width="3">
      <line x1="0" y1="-30" x2="0" y2="-22"/>
      <line x1="0" y1="22" x2="0" y2="30"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <line x1="22" y1="0" x2="30" y2="0"/>
    </g>
  </g>
</svg>
