<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="illo-opensource-title">
  <title id="illo-opensource-title">A branching line splitting from one point into two, representing open-source collaboration</title>
  <rect width="400" height="300" fill="none"/>
  <path d="M90 150 H170" fill="none" stroke="#2A2A2D" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 150 C210 150 210 90 250 90" fill="none" stroke="#E8590C" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 150 C210 150 210 210 250 210" fill="none" stroke="#F7941E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="150" r="14" fill="#2A2A2D"/>
  <circle cx="170" cy="150" r="10" fill="#2A2A2D"/>
  <circle cx="260" cy="90" r="14" fill="#E8590C"/>
  <circle cx="260" cy="210" r="14" fill="#F7941E"/>
  <!-- small dashed arc nodding to the logo's signal motif -->
  <circle cx="80" cy="150" r="26" fill="none" stroke="#2A2A2D" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 6"/>
</svg>
